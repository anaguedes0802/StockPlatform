name: stockplatform

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: stockplatform
      POSTGRES_PASSWORD: stockplatform
      POSTGRES_DB: stockplatform
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://stockplatform:stockplatform@postgres:5432/stockplatform
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-change-me
      CORS_ORIGINS: http://localhost:3000
      ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]
    volumes:
      - ./apps/api:/app
      - apicache:/root/.cache
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000      # server-side /api proxy target
      API_PUBLIC_URL: http://localhost:8000  # browser connects here for live-quote websockets
    depends_on:
      - api
    ports: ["3000:3000"]
    volumes:
      - ./apps/web:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 3000 --reload

volumes:
  pgdata:
  apicache:
